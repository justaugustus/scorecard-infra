# The AWS batch plane's config overlay, replacing cron/config/config.yaml on
# EKS. Becomes the `scorecard-config` ConfigMap every workload mounts at
# /etc/scorecard/config.yaml; see cron/k8s/README.md for the command.
#
# Task 9.7 repointed the four writable buckets from their -test counterparts
# (E7) to the adopted production corpus. The IAM policies in
# deploy/cron/modules/cluster grant both, so this file is the switch between
# them: rolling back is an edit here plus a ConfigMap re-apply and a restart,
# with no policy change applied while a run is in flight.
#
# That makes this file, and not any env var in cron/k8s, the single place the
# plane's target is described -- api-base-url included, so the corpus a run
# writes and the CDN it purges cannot drift apart. cron/config's
# TestAWSOverlayBucketsAreTheProductionCorpus holds the pair together.

# Read only by the Stackdriver exporter and the BigQuery transfer job, neither
# of which runs here. Kept rather than dropped because an absent value returns
# ErrEmptyConfigValue if anything reaches for it, and a stale-but-harmless
# string beats a start-up failure in a path nobody exercises.
project-id: openssf

# Deliberately absent, supplied per-workload from the `scorecard-queue`
# ConfigMap as SCORECARD_REQUEST_TOPIC_URL and
# SCORECARD_REQUEST_SUBSCRIPTION_URL:
#
#   request-topic-url
#   request-subscription-url
#
# An SQS queue URL contains the AWS account ID and this repository is public,
# following the same reasoning that scrubbed live resource IDs out of the
# proposal. Both point at the one queue: SQS has no separate topic and
# subscription, so publish and consume address the same resource.

# BigQuery is not part of this change -- the transfer jobs are not ported
# (task 7.3) and no AWS equivalent is wired up, so bigquery-dataset,
# bigquery-table and raw-bigquery-table are all omitted rather than left
# pointing at a dataset nothing writes.

completion-threshold: 0.99
shard-size: 10
webhook-url:

# Not stackdriver: that is a GCP product and there is no project to export to.
# Not empty either -- cron/monitoring's GetExporter returns
# ErrEmptyConfigValue for a blank value and cron/internal/worker calls it
# during start-up, so a blank here is a CrashLoopBackOff rather than metrics
# quietly switched off. `printer` is the in-tree no-backend exporter. A real
# CloudWatch exporter is out of scope for this change.
metric-exporter: printer

# Task 9.7: the four writable buckets below are the production corpus, not the
# -test counterparts E7 created. The IAM roles grant both, so switching back is
# this file plus a ConfigMap re-apply -- no policy change mid-run.
#
# Shard and completion state. Keyed YYYY.MM.DD/HHMMSS/, so a run cannot
# overwrite an earlier one; it only ever adds a prefix.
result-data-bucket-url: s3://ossf-scorecard-data2

# TODO temporarily leaving old variables until changes propagate to production
#
# Read-only from the controller's side, so it has no test counterpart and
# points at the real adopted bucket (E7). Reading the live inventory during
# verification carries no write risk.
input-bucket-url: s3://ossf-scorecard-input-projects
# Can be used to specify directories within a bucket. Can be empty.
input-bucket-prefix:

additional-params:
  input-bucket:
    url: s3://ossf-scorecard-input-projects
    # Optional prefix to limit files used as input files within a bucket (e.g. a specific file or directory)
    prefix:
    # Optional file to read a prefix from, instead of statically defining prefix above (note: prefix must be blank to use this option)
    # This is good in situations where the prefix changes frequently (e.g. always using the most recent folder in a bucket)
    prefix-file:

  scorecard:
    # for sending PURGE requests to CDN
    api-base-url: https://api.scorecard.dev
    # API results bucket. The one the live API reads as its fallback for any
    # repository without a self-published result, and the only writable bucket
    # here whose keys a run overwrites rather than adds to: <repo>/results.json
    # and <repo>/raw.json are "latest" pointers. Versioning is on, keeping the
    # last three runs.
    api-results-bucket-url: s3://ossf-scorecard-cron-results
    # CI-Tests needs a lot of GitHub API tokens, Dependency-Update-Tool is
    # search heavy, and Vulnerabilities is slow on repos with lots of
    # dependencies.
    # TODO(#859): Re-add Contributors after fixing inconsistencies.
    #
    # Vulnerabilities matches what GCP's cron actually ran. Its last records
    # carry 14 checks without it in every repository sampled, while this
    # file's grafted value lists four exclusions and would emit 15. The drift
    # lived in the deployed ConfigMap -- no manifest ever set an env override
    # -- and cannot be confirmed now that GCP is shut down, so this follows
    # what cron-served results actually contained.
    blacklisted-checks: CI-Tests,Contributors,Dependency-Update-Tool,Vulnerabilities,Webhooks
    # Read by every scan and written by the CII CronJob. The production copy
    # has been frozen since 2026-08-30 -- GCP's last run -- because this
    # pointed at the test bucket, so run scripts/verification/run-cii-cycle.sh
    # against production once after this lands and before the next scan.
    cii-data-bucket-url: s3://ossf-scorecard-cii-data
    # Raw results. Keyed like data2, so also add-only.
    raw-result-data-bucket-url: s3://ossf-scorecard-rawdata
