version: 2
updates:
- package-ecosystem: "gomod"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  groups:
    gomod:
      patterns:
        - "*"
      exclude-patterns:
        - "golang.org/x/*"
    golang-x:
      patterns:
        - "golang.org/x/*"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  groups:
    github-actions:
      patterns:
        - "*"
      exclude-patterns:
        - "actions/*"
        - "github/*"
        - "golangci/*"
    github-owned:
      patterns:
        - "actions/*"
        - "github/*"
    golangci:
      patterns:
        - "golangci/*"

# Batch pipeline container images. Six, not the five the migration plan
# anticipated: the GitHub token-pool server's Dockerfile moved into cron/ with
# the rest of the pipeline (C6), so it is covered here rather than upstream.
- package-ecosystem: "docker"
  directory: "/cron/internal/bq"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
- package-ecosystem: "docker"
  directory: "/cron/internal/cii"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
- package-ecosystem: "docker"
  directory: "/cron/internal/controller"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
- package-ecosystem: "docker"
  directory: "/cron/internal/githubserver"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
- package-ecosystem: "docker"
  directory: "/cron/internal/webhook"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
- package-ecosystem: "docker"
  directory: "/cron/internal/worker"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
