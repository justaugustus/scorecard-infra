# Builds and tests this repository against ossf/scorecard's main branch.
#
# Why this exists (design C7/C8): before the migration, the batch pipeline lived
# in ossf/scorecard and was built against the in-tree engine, so an engine change
# that broke the pipeline failed at PR time. After the split the pipeline builds
# against a pinned engine release, which makes production reproducible but moves
# breakage discovery to dependency-bump time. This canary buys most of that
# signal back.
#
# It is deliberately NOT a pull-request check. It tests someone else's branch, so
# a red run usually means upstream work in progress, and gating this repository's
# PRs on that would block unrelated changes. It must still be watched: a canary
# nobody reads is worse than no canary, because it manufactures confidence.
#
# A sustained red canary is a signal to talk to the engine maintainers BEFORE the
# next dependency bump lands, not after.

name: canary

on:
  schedule:
    # 06:17 UTC daily. Off the hour on purpose: scheduled workflows bunch up on
    # the hour and get queued.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-against-engine-main:
    name: build and test against scorecard main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit # TODO(workflow): change to 'egress-policy: block' after a couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          check-latest: true

      - name: Point the engine dependency at upstream main
        run: |
          go get github.com/ossf/scorecard/v5@main
          go mod tidy
          echo "Resolved engine version:"
          go list -m github.com/ossf/scorecard/v5

      - name: Build
        run: go build ./...

      # Runs the whole suite, which includes cron/internal/format's
      # Test_GenerateBQSchema and Test_GenerateJSONSchema. Those verify the
      # published BigQuery/JSON schema contract against the engine's Go data
      # model, so this step is also the C8 cross-repo drift check: it catches a
      # data-model change before the corresponding release is ever pinned.
      - name: Test
        run: go test ./... -race

      # The dependency bump itself must fail hard on schema drift rather than
      # warn. That is enforced by the same tests running in presubmits.yml
      # against the pinned version; this job is the early warning, not the gate.
      - name: Report the go.mod delta
        if: always()
        run: git diff --no-color go.mod || true
