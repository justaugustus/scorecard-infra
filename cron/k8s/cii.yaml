# Its own ServiceAccount, like every other workload here: Pod Identity binds
# one IAM role per ServiceAccount, and this one is scoped to the cii-data
# bucket alone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scorecard-cii-worker
---

apiVersion: batch/v1
kind: CronJob
metadata:
  name: scorecard-cii-worker
spec:
  # At 00:00UTC on 1st of every month.
  schedule: "0 20 * * 0"
  concurrencyPolicy: "Forbid"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: scorecard-cii-worker
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          # System pool. This fetches from the OpenSSF Best Practices API once
          # a month rather than cloning repositories, so it does not need a
          # scanning node and should not displace one.
          nodeSelector:
            scorecard.dev/pool: system
          containers:
            - name: cii-worker
              image: ghcr.io/ossf/scorecard-cii-worker:main
              args: ["--config=/etc/scorecard/config.yaml"]
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: config-volume
                  mountPath: /etc/scorecard
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config-volume
              configMap:
                name: scorecard-config
            - name: tmp
              emptyDir: {}
