# One ServiceAccount per workload: EKS Pod Identity binds a single IAM role to
# a ServiceAccount, so the four associations in deploy/cron/modules/cluster
# cannot all hang off "default".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scorecard-batch-controller
---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scorecard-batch-controller
rules:
  - apiGroups: ["apps", "extensions"]
    resources: ["deployments"]
    resourceNames: ["scorecard-batch-worker"]
    verbs: ["get", "patch"]
---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scorecard-batch-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scorecard-batch-controller
subjects:
  # Repointed off "default" with the ServiceAccount above: the rollout restart
  # below runs in this CronJob's pod, so the grant has to follow the identity
  # that pod actually runs as.
  - kind: ServiceAccount
    name: scorecard-batch-controller
---

apiVersion: batch/v1
kind: CronJob
metadata:
  name: scorecard-batch-controller
spec:
  # At 02:00UTC on Monday.
  schedule: "0 2 * * 1"
  concurrencyPolicy: "Forbid"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: scorecard-batch-controller
          # System pool: this bursts to one pod a week and wants 1Gi, so it has
          # no business competing with the scanning workers for a node.
          nodeSelector:
            scorecard.dev/pool: system
          containers:
            - name: controller
              image: ghcr.io/ossf/scorecard-batch-controller:main
              args: [
                "--config=/etc/scorecard/config.yaml",
                "cron/internal/data/projects.csv",
                "cron/internal/data/gitlab-projects.csv",
              ]
              imagePullPolicy: Always
              env:
                - name: GOMEMLIMIT
                  value: "950MiB"
                # Supplied at deploy time -- the queue URL embeds the AWS
                # account ID. See this directory's README.
                - name: SCORECARD_REQUEST_TOPIC_URL
                  valueFrom:
                    configMapKeyRef:
                      name: scorecard-queue
                      key: request-topic-url
              resources:
                limits:
                  memory: 1Gi
                requests:
                  memory: 1Gi
              volumeMounts:
                - name: config-volume
                  mountPath: /etc/scorecard
                  readOnly: true
            - name: worker-update
              image: bitnami/kubectl@sha256:44468c0f5b348e6dcf5e11feb6fdcc969c874bba2856150fe50eb1aacb3bdfee
              command:
                - "kubectl"
                - "rollout"
                - "restart"
                - "deployment/scorecard-batch-worker"
          volumes:
            - name: config-volume
              configMap:
                name: scorecard-config
